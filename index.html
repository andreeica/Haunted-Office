<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haunted Office 👻</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Welcome to the Haunted Office 🎃</h1>
    <p>Dare to meet our spooky team...</p>
  </header>

  <section id="departments">
    <div class="department">
      <h2>🕸 Development</h2>
      <div class="employee">
        <img src="https://placehold.co/150x150?text=Ghost+Dev" alt="Developer Ghost" />
        <p>Sergiu “The Code Phantom”</p>
      </div>
    </div>

    <div class="department">
      <h2>🧪 QA & Testing</h2>
      <div class="employee">
        <img src="https://placehold.co/150x150?text=QA+Spirit" alt="QA Ghost" />
        <p>Nichita “The Bug Hunter”</p>
      </div>
    </div>

    <div class="department">
      <h2>🩸 Design</h2>
      <div class="employee">
        <img src="https://placehold.co/150x150?text=Dark+Designer" alt="Design Ghost" />
        <p>Alexandrina “Pixel Witch”</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Haunted Office. Beware of bugs... 🪳</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
